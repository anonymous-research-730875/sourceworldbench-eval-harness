# Baseline: constant_seconds on sourceworldbench-time-prediction.
# Copied from configs/templates/time/prediction.yaml.

shared:
  output_root: outputs/time_prediction
  output_tag: constant_seconds

task:
  name: time_prediction
  id_field: instance_id
  require_full_coverage: true

load:
  name: anonymous-research-730875/sourceworldbench-time-prediction
  split: test
  revision: v0.2.0

predict:
  model: constant_seconds
  params: { seconds: 5 }
  output: predictions.jsonl

evaluate:
  input: predictions.jsonl
  output: metrics.json

leaderboard:
  input: metrics.json
  dataset: anonymous-research-730875/sourceworldbench-time-prediction
  model: constant_seconds
