# Template for the single-test-status task. Copy it, replace every <placeholder>,
# then run:
#
#   uv run python -m sourceworldbench_eval_harness.prediction.predict  <your-config>.yaml
#   uv run python -m sourceworldbench_eval_harness.evaluation.evaluate <your-config>.yaml
#
# One evaluation scores every question the prediction file answers, so the
# metrics file holds `binary_*` and `outcome_*` side by side. There is no `all_pass`
# here: a row holds one test, so there is no set to ask about.

shared:
  output_root: outputs/single_test_status
  output_tag: <tag>         # artifacts land in `<output_root>_<tag>`, so give each
                            # model its own and parallel runs stay apart

task:
  name: single_test_status
  id_field: instance_id     # column identifying one patched repo state + test
  # calls_file: ~/function_called.json   # optional context: {instance_id: [call, ...] | null}
                            # never scored, read only when generating predictions
  require_full_coverage: true   # every dataset instance must be answered

load:
  name: anonymous-research-730875/sourceworldbench-single-test-status
  split: test
  revision: v0.2.0          # pinned: unpinned runs track `main`, so a dataset push
                            # silently changes the eval set. The resolved commit is
                            # recorded in the sidecar either way.

predict:
  model: <model>            # all_passed | random_status | oracle
  params: {}                # random_status takes { seed }; add
                            # `questions: [outcome]` to answer a subset
  output: predictions.jsonl

evaluate:
  input: predictions.jsonl
  output: metrics.json

leaderboard:
  input: metrics.json
  dataset: anonymous-research-730875/sourceworldbench-single-test-status  # task grouping key (shown as its slug)
  model: <model>                                     # name shown on the leaderboard
